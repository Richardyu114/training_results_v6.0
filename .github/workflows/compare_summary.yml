name: Compare Summary

on:
  pull_request_target:
    types: [opened, synchronize]
    branches:
      - main

env:
  benchmark: training
  version: "6.0.0"

jobs:
  compare_summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install submission checker
        run: pip install "git+https://github.com/mlcommons/logging.git@master"

      - name: Generate Report
        run: |
          python3 -m mlperf_logging.result_summarizer "${GITHUB_WORKSPACE}/{*}" ${{ env.benchmark }} ${{ env.version }} --csv /tmp/summary.csv --generate_private_ids

      - name: Checkout results branch
        uses: actions/checkout@v4
        with:
          ref: results_branch
          path: results_branch

      - name: Diff Reports
        id: diff_reports
        run: |
          has_changes=false
          if ! diff -q /tmp/summary.csv results_branch/summary.csv > /dev/null 2>&1; then
            has_changes=true
          fi
          if ! diff -q /tmp/summary_detailed.csv results_branch/summary_detailed.csv > /dev/null 2>&1; then
            has_changes=true
          fi
          echo "has_changes=$has_changes" >> $GITHUB_OUTPUT

      - name: No Changes Comment PR
        if: steps.diff_reports.outputs.has_changes == 'false'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: No changes made in the spreadsheet by this PR
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Diff Files
        if: steps.diff_reports.outputs.has_changes == 'true'
        run: |
          python3 ${GITHUB_WORKSPACE}/.github/scripts/export_diff.py \
            --source results_branch/summary.csv \
            --target /tmp/summary.csv \
            --output results_branch/${{ github.event.pull_request.number }}_results_folder/
          python3 ${GITHUB_WORKSPACE}/.github/scripts/export_diff.py \
            --source results_branch/summary_detailed.csv \
            --target /tmp/summary_detailed.csv \
            --output results_branch/${{ github.event.pull_request.number }}_results_folder/ \
            --suffix _detailed

      - name: Commit and Push Results
        if: steps.diff_reports.outputs.has_changes == 'true'
        run: |
          cp /tmp/summary.csv results_branch/${{ github.event.pull_request.number }}_results_folder/summary.csv
          cp /tmp/summary_detailed.csv results_branch/${{ github.event.pull_request.number }}_results_folder/summary_detailed.csv
          cd results_branch
          git config user.email 'github.actions@noreply.com'
          git config user.name 'Github Actions'
          git add .
          git commit -m '[Automated Commit] Generate summary for PR #${{ github.event.pull_request.number }}'
          git push origin results_branch

      - name: Changes Comment PR
        if: steps.diff_reports.outputs.has_changes == 'true'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            This PR will change the spreadsheet. You can find the new changes [here](${{ github.server_url }}/${{ github.repository }}/tree/results_branch/${{ github.event.pull_request.number }}_results_folder)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
