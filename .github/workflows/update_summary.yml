name: Update Summary

on:
  push:
    branches:
      - main

env:
  benchmark: training
  version: "6.0.0"

jobs:
  update_summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install submission checker
        run: pip install "git+https://github.com/mlcommons/logging.git@master"

      - name: Generate Report
        run: |
          python3 -m mlperf_logging.result_summarizer "${GITHUB_WORKSPACE}/{*}" ${{ env.benchmark }} ${{ env.version }} --csv /tmp/summary.csv --generate_private_ids

      - name: Checkout results branch
        uses: actions/checkout@v4
        with:
          ref: results_branch
          path: results_branch

      - name: Commit Report
        run: |
          has_changes=false
          if ! diff -q /tmp/summary.csv results_branch/summary.csv > /dev/null 2>&1; then
            has_changes=true
          fi
          if ! diff -q /tmp/summary_detailed.csv results_branch/summary_detailed.csv > /dev/null 2>&1; then
            has_changes=true
          fi
          if [ "$has_changes" = "true" ]; then
            cp /tmp/summary.csv results_branch/summary.csv
            cp /tmp/summary_detailed.csv results_branch/summary_detailed.csv
            cd results_branch
            git config user.email 'github.actions@noreply.com'
            git config user.name 'Github Actions'
            git add summary.csv summary_detailed.csv
            git commit -m '[Automated Commit] Generate summary'
            git push origin results_branch
          fi
