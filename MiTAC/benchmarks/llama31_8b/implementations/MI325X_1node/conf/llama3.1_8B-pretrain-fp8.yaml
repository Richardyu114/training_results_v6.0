work_group: ${TEAM:amd}
user_name: ${USER:root}
exp_name: ${EXP_NAME:llama3.1_8B-pretrain-mlperf-fp8}
workspace: /tmp/primus-output

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml

    # model to run
    model: llama3.1_8B.yaml
    overrides:
      tokenizer_model: /model
      # --- Logging Config ---
      disable_wandb: true
      disable_tensorboard: true
      stderr_sink_level: ERROR
      log_interval: 9999999
      log_avg_skip_iterations: 2
      log_avg_reset_interval: 50
      eval_iters: ${PRIMUS_EVAL_ITERS:32}
      eval_interval: ${PRIMUS_EVAL_INTERVAL:10}

      # --- Training Config ---
      train_iters: ${PRIMUS_TRAIN_ITERS:1200000}        # v6.0 §9: fixed at 1,200,000
      micro_batch_size: ${PRIMUS_MICRO_BATCH_SIZE:2}
      global_batch_size: ${PRIMUS_GLOBAL_BATCH_SIZE:32}
      seq_length: 8192
      max_position_embeddings: 8192
      seed: ${SEED:1234}
      lr: ${PRIMUS_LR:0.0008}
      min_lr: ${PRIMUS_MIN_LR:0.00008}                  # v6.0 §9: must equal lr * 0.1
      lr_warmup_iters: ${PRIMUS_LR_WARMUP_ITERS:64}
      lr_decay_iters: ${PRIMUS_LR_DECAY_ITERS:1199936}  # v6.0 §9: must equal train_iters - lr_warmup_iters
      lr_decay_style: cosine
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      eod_mask_loss: false
      init_method_std: 0.02
      norm_epsilon: 1.0e-5
      adam_eps: 1.0e-5
      check_for_nan_in_loss_and_grad: false
      check_for_spiky_loss: false
      check_for_large_grads: false

      # --- Model Parallel Config ---
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
      overlap_grad_reduce: true
      overlap_param_gather: true
      gradient_accumulation_fusion: true
      masked_softmax_fusion: true
      average_in_collective: true

      # --- Data Config ---
      mock_data: false
      train_data_path: "/data/c4-train.en_6_text_document"
      valid_data_path: "/data/c4-validation-91205-samples.en_text_document"
      test_data_path: null
      seq_length: 8192
      data_cache_path: /npy_indices
      mmap_bin_files: true
      data_cache_path: null

      # --- Profiling Config ---
      profile: false
      use_pytorch_profiler: true
      profile_ranks: [0]
      profile_step_start: 8
      profile_step_end: 13
      disable_profiler_activity_cpu: false
      torch_profiler_record_shapes: false
      torch_profiler_with_stack: false
      torch_profiler_use_gzip: true

      # --- Checkpointing Config ---
      finetune: false
      auto_continue_train: false
      load: null
      no_load_optim: null
      no_load_rng: null
      save: null
      save_interval: 2000000
      no_save_optim: null
      no_save_rng: null
      disable_last_saving: true
      ckpt_format: torch

      # --- FSDP Config ---
      use_torch_fsdp2: false
      use_distributed_optimizer: true

      # Cross entropy flags
      cross_entropy_fusion_impl: "te"
      cross_entropy_loss_fusion: true

      # --- Mixed Precision Config (FP8 hybrid for CDNA3 / MI325X) ---
      # Slimmed to match AMD's official Primus MI300X (gfx942) FP8 config:
      #   examples/megatron/configs/MI300X/llama3.1_8B-FP8-pretrain.yaml
      # which only sets `fp8: hybrid` and lets Megatron defaults handle the rest.
      # The previous extras (fp8_recipe / attention_softmax_in_fp32 /
      # accumulate_allreduce_grads_in_fp32 / grad_reduce_in_bf16) were suspected
      # of triggering MI325X NaN at first eval; they're commented out for now.
      fp4: false
      fp8: hybrid
      moe_use_legacy_grouped_gemm: false
      # fp8_recipe: delayed
      # accumulate_allreduce_grads_in_fp32: false
      # grad_reduce_in_bf16: true
      # attention_softmax_in_fp32: false

      # --- Primus Turbo Config ---
      enable_primus_turbo: false
      use_turbo_attention: false
      use_turbo_parallel_linear: false
      use_turbo_grouped_mlp: false
      moe_use_fused_router_with_aux_score: false
      enable_turbo_attention_float8: false
