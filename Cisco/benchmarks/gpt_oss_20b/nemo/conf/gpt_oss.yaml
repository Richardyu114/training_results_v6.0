defaults:
  - optional tp_overlap@model.ub_tp_comm_overlap_cfg: ${oc.env:GPU_ARCH,h100}tp${oc.env:TENSOR_MODEL_PARALLEL}mbs${oc.env:MICRO_BATCH_SIZE}

trainer:
  devices: ${oc.decode:${oc.env:DGXNGPU,8}}
  num_nodes: ${oc.decode:${oc.env:DGXNNODES,1}}
  precision: bf16
  max_steps: ${oc.decode:${oc.env:MAX_STEPS,${ceil_div:1382400000,${model.global_batch_size}}}}
  max_epochs: 1
  log_every_n_steps: ${oc.decode:${oc.env:LOG_EVERY_N_STEPS,1}}

  val_check_interval: ${oc.decode:${oc.env:VAL_CHECK_INTERVAL,1024}}
  eval_iters: ${oc.decode:${oc.env:LIMIT_VAL_BATCHES,${ceil_div:${oc.decode:${oc.env:VAL_SAMPLES,1024}},${model.global_batch_size}}}}

  limit_test_batches: ${oc.decode:${oc.env:LIMIT_TEST_BATCHES,1}}
  limit_train_batches: ${oc.decode:${oc.env:LIMIT_TRAIN_BATCHES,null}}
  enable_progress_bar: ${oc.decode:${oc.env:ENABLE_PROGRESS_BAR,False}}
  num_sanity_val_steps: 0

exp_manager:
  explicit_log_dir: '/results'
  load_optim: ${oc.decode:${oc.env:LOAD_OPTIMIZER,False}}
  load_rng_state: ${oc.decode:${oc.env:LOAD_RNG_STATE,False}}
  async_save: False
  log_step_timing: True
  log_global_rank_0_only: True

model:
  mcore_gpt: True
  name: megatron_gpt_full_te_layer_autocast

  add_bias_linear: ${oc.decode:${oc.env:ADD_BIAS_LINEAR,True}}
  tensor_model_parallel_size: ${oc.decode:${oc.env:TENSOR_MODEL_PARALLEL}}
  pipeline_model_parallel_size: ${oc.decode:${oc.env:PIPELINE_MODEL_PARALLEL}}
  virtual_pipeline_model_parallel_size: ${oc.decode:${oc.env:INTERLEAVED_PIPELINE,null}}
  context_parallel_size: ${oc.decode:${oc.env:CONTEXT_PARALLEL,1}}
  expert_model_parallel_size: ${oc.decode:${oc.env:EXPERT_PARALLEL,1}}
  expert_tensor_parallel_size: ${oc.decode:${oc.env:EXPERT_TENSOR_PARALLEL,1}}
  mcore_fsdp: ${oc.decode:${oc.env:USE_MCORE_FSDP,False}}

  moe_token_dispatcher_type: ${oc.decode:${oc.env:MOE_TOKEN_DISPATCHER_TYPE,flex}}
  moe_flex_dispatcher_backend: ${oc.decode:${oc.env:MOE_FLEX_DISPATCHER_BACKEND,deepep}}
  moe_deepep_num_sms: ${oc.decode:${oc.env:MOE_DEEPEP_NUM_SMS,20}}
  moe_hybridep_num_sms: ${oc.decode:${oc.env:MOE_HYBRIDEP_NUM_SMS,32}}
  moe_hybridep_num_sms_preprocessing: ${oc.decode:${oc.env:MOE_HYBRIDEP_NUM_SMS_PREPROCESSING,108}}
  moe_permute_fusion_into_hybridep: ${oc.decode:${oc.env:MOE_PERMUTE_FUSION_INTO_HYBRIDEP,False}}
  moe_grouped_gemm: ${oc.decode:${oc.env:MOE_GROUPED_GEMM,True}}
  moe_router_pre_softmax: ${oc.decode:${oc.env:MOE_ROUTER_PRE_SOFTMAX,False}}
  moe_router_topk_scaling_factor: ${oc.decode:${oc.env:MOE_ROUTER_TOPK_SCALING_FACTOR,null}}
  moe_router_fusion: ${oc.decode:${oc.env:MOE_ROUTER_FUSION,True}}
  moe_router_force_load_balancing: ${oc.decode:${oc.env:MOE_ROUTER_FORCE_LOAD_BALANCING,False}}
  moe_router_load_balancing_type: ${oc.decode:${oc.env:MOE_ROUTER_LOAD_BALANCING_TYPE,none}}
  moe_permute_fusion: ${oc.decode:${oc.env:MOE_PERMUTE_FUSION,False}}
  moe_expert_rank_capacity_factor: ${oc.decode:${oc.env:MOE_EXPERT_RANK_CAPACITY_FACTOR,null}}
  moe_pad_expert_input_to_capacity: ${oc.decode:${oc.env:MOE_PAD_EXPERT_INPUT_TO_CAPACITY,False}}
  moe_expert_capacity_factor: ${oc.decode:${oc.env:MOE_EXPERT_CAPACITY_FACTOR,null}}
  moe_paged_stash: ${oc.decode:${oc.env:MOE_PAGED_STASH,False}}
  moe_paged_stash_buffer_size_factor_cuda: ${oc.decode:${oc.env:MOE_PAGED_STASH_BUFFER_SIZE_FACTOR_CUDA,null}}
  moe_single_grouped_weight_bias: ${oc.decode:${oc.env:MOE_SINGLE_GROUPED_WEIGHT_BIAS,False}}

  micro_batch_size: ${oc.decode:${oc.env:MICRO_BATCH_SIZE,1}}
  global_batch_size: ${oc.decode:${oc.env:GLOBAL_BATCH_SIZE,${multiply:${oc.decode:${oc.env:MINIBS}},${floor_div:${multiply:${trainer.devices},${trainer.num_nodes}},${multiply:${multiply:${model.tensor_model_parallel_size},${model.pipeline_model_parallel_size}},${model.context_parallel_size}}}}}}
  use_tp_pp_dp_mapping: ${oc.decode:${oc.env:TP_PP_DP_MAPPING,False}}

  overwritten_attributes:
    num_layers: ${oc.decode:${oc.env:OVERWRITTEN_NUM_LAYERS,24}}
    enable_cuda_graph: ${oc.decode:${oc.env:MCORE_CUDA_GRAPH,False}}
    cuda_graph_scope: ${oc.env:CUDA_GRAPH_SCOPE, null}
    cuda_graph_implementation: ${oc.env:CUDA_GRAPH_IMPLEMENTATION, "none"}

  encoder_seq_length: ${oc.decode:${oc.env:ENCODER_SEQ_LENGTH,8192}}
  position_embedding_type: ${oc.decode:${oc.env:POSITION_EMBEDDING_TYPE,rope}}
  overlap_p2p_comm: ${oc.decode:${oc.env:OVERLAP_P2P_COMM,True}}
  batch_p2p_comm: ${oc.decode:${oc.env:BATCH_P2P_COMM,False}}
  account_for_embedding_in_pipeline_split: ${oc.decode:${oc.env:ASYM_PP_EMBED,False}}
  account_for_loss_in_pipeline_split: ${oc.decode:${oc.env:ASYM_PP_LOSS,False}}
  recompute_modules: ${oc.env:RECOMPUTE_MODULES, null}
  cp_comm_type: ${oc.decode:${oc.env:CP_COMM_TYPE,'a2a'}}

  external_cuda_graph: ${oc.decode:${oc.env:LAYER_CUDA_GRAPH,False}}

  seed: ${oc.decode:${oc.env:SEED,1234}}
  use_rng_tracker: ${oc.decode:${oc.env:USE_RNG_TRACKER,True}}

  defer_embedding_wgrad_compute: ${oc.decode:${oc.env:DEFER_EMBEDDING_WGRAD_COMPUTE,False}}
  wgrad_deferral_limit: ${oc.decode:${oc.env:WGRAD_DEFERRAL_LIMIT,0}}

  gradient_accumulation_fusion: ${oc.decode:${oc.env:GRAD_ACCUM_FUSION,True}}
  fused_single_qkv_rope: ${oc.decode:${oc.env:FUSED_QKV_ROPE,False}}
  cross_entropy_loss_fusion: ${oc.decode:${oc.env:CROSS_ENTROPY_LOSS_FUSION,True}}
  deterministic_mode: ${oc.decode:${oc.env:DETERMINISTIC_MODE,False}}

  cpu_offloading: ${oc.decode:${oc.env:CPU_OFFLOADING,False}}
  cpu_offloading_num_layers: ${oc.decode:${oc.env:CPU_OFFLOADING_NUM_LAYERS,95}}

  resume_from_checkpoint: ${oc.env:LOAD_CHECKPOINT,null}
  dist_ckpt_format: ${if:${model.mcore_fsdp},fsdp_dtensor,torch_dist}
  dist_ckpt_parallel_load: ${oc.decode:${oc.env:DIST_CKPT_PARALLEL_LOAD,True}}
  sync_batch_comm: ${oc.decode:${oc.env:SYNC_BATCH_COMM,False}}

  activations_checkpoint_granularity: ${oc.decode:${oc.env:ACT_CKPT_GRANULARITY,null}}
  activations_checkpoint_method: ${oc.decode:${oc.env:ACT_CKPT_METHOD,null}}
  activations_checkpoint_num_layers: ${oc.decode:${oc.env:ACT_CKPT_NUM_LAYERS,null}}
  sequence_parallel: ${oc.decode:${oc.env:SEQ_PARALLEL,True}}

  transformer_engine: ${oc.decode:${oc.env:TRANSFORMER_ENGINE,True}}
  fp8: ${oc.decode:${oc.env:FP8,False}}
  fp8_hybrid: ${oc.decode:${oc.env:FP8_HYBRID,False}}
  fp8_recipe: ${oc.decode:${oc.env:FP8_RECIPE,tensorwise}}
  fp8_amax_history_len: ${oc.decode:${oc.env:FP8_AMAX_HISTORY,1}}
  fp8_amax_compute_algo: ${oc.env:FP8_AMAX_ALGO,most_recent}
  reuse_grad_buf_for_mxfp8_param_ag: ${oc.decode:${oc.env:REUSE_GRAD_BUF_FOR_MXFP8_PARAM_AG, False}}
  fp4: ${oc.decode:${oc.env:FP4,False}}
  fp4_recipe: ${oc.decode:${oc.env:FP4_RECIPE,nvfp4}}
  reduce_amax: ${oc.decode:${oc.env:FP8_REDUCE_AMAX,True}}
  tp_only_amax_red: ${oc.decode:${oc.env:TP_ONLY_AMAX_RED,True}}
  first_last_layers_bf16: ${oc.decode:${oc.env:FIRST_LAST_LAYERS_BF16,False}}
  num_layers_at_start_in_bf16: ${oc.decode:${oc.env:NUM_LAYERS_AT_START_IN_BF16,0}}
  num_layers_at_end_in_bf16: ${oc.decode:${oc.env:NUM_LAYERS_AT_END_IN_BF16,0}}
  fp8_dot_product_attention: ${oc.decode:${oc.env:FP8_DPA,False}}

  use_te_rng_tracker: True
  use_transformer_engine_op_fuser: ${oc.decode:${oc.env:USE_TE_OPS,True}}
  cross_entropy_fusion_impl: ${oc.decode:${oc.env:CE_FUSION_IMPL,'te'}}
  ub_tp_comm_overlap: ${oc.decode:${oc.env:TP_COMM_OVERLAP,False}}
  tp_comm_overlap_ag: ${oc.decode:${oc.env:MC_TP_OVERLAP_AG,False}}
  tp_comm_overlap_rs: ${oc.decode:${oc.env:MC_TP_OVERLAP_RS,False}}

  nccl_communicator_config_path: ${oc.decode:${oc.env:NCCL_CFG_PATH,null}}
  sharp: ${oc.decode:${oc.env:SHARP,False}}

  tokenizer:
    model: '/workspace/llm/nemo_tokenizer'

  data:
    index_mapping_dir: '/npy_index'
    splits_string: null
    validation_drop_last: False
    pad_samples_to_global_batch_size: True
    shuffle_documents: False
    legacy_dataset: ${oc.decode:${oc.env:LEGACY_DATASET,True}}
    delay_data_init: ${model.data.legacy_dataset}
    delay_data_mmap: ${model.data.delay_data_init}
    no_seqlen_plus_one_input_tokens: ${oc.decode:${oc.env:CUSTOM_INPUT_PIPELINE,True}}
    exchange_indices_distributed: ${oc.decode:${oc.env:EXCHANGE_INDICES_DISTRIBUTED,True}}
    mock_dataset: ${oc.decode:${oc.env:MOCK_DATASET,False}}
    mock_tokenizer_vocab_size: ${oc.decode:${oc.env:MOCK_TOKENIZER_VOCAB_SIZE,32000}}
    num_workers: ${oc.decode:${oc.env:NUM_WORKERS,8}}

  optim:
    overlap_grad_reduce: ${oc.decode:${oc.env:OVERLAP_GRAD_REDUCE,True}}
    overlap_param_gather: ${oc.decode:${oc.env:OVERLAP_PARAM_GATHER,True}}
    align_param_gather:  ${oc.decode:${oc.env:ALIGN_PARAM_GATHER,False}}
    use_distributed_optimizer: ${oc.decode:${oc.env:USE_DIST_OPTIMIZER,True}}
    bucket_size: ${oc.decode:${oc.env:BUCKET_SIZE,134217728}}
    fp8_param_gather: ${oc.decode:${oc.env:FP8_PARAM_GATHER,False}}
    num_distributed_optimizer_instances: ${oc.decode:${oc.env:NUM_DISTOPT_INSTANCES,1}}
    outer_dp_sharding_strategy: ${oc.decode:${oc.env:OUTER_DP_SHARDING_STRATEGY,no_shard}}
    overlap_param_gather_with_optim_step: ${oc.decode:${oc.env:OVERLAP_PARAM_GATHER_WITH_OPTIM_STEP,False}}
    nccl_ub_dp: ${oc.decode:${oc.env:NCCL_UB_DP,False}}
    lr: ${oc.decode:${oc.env:LR,${div:${multiply:0.00008,${model.global_batch_size}},1152}}}
    adam_eps: ${oc.decode:${oc.env:ADAM_EPS,1e-5}}
    sched:
      min_lr: ${oc.decode:${oc.env:MIN_LR,${div:${model.optim.lr},10.0}}}
      lr_warmup_iters: ${oc.decode:${oc.env:LR_WARMUP_STEPS,${div:9216000,${model.global_batch_size}}}}
      max_steps_for_lr_sched: ${oc.decode:${oc.env:MAX_STEPS_FOR_LR_SCHED,${div:1382400000,${model.global_batch_size}}}}
    lock_timeout: ${oc.decode:${oc.env:OPTIM_LOCK_TIMEOUT,null}}

  gc_interval_train: ${oc.decode:${oc.env:GC_TRAIN,1000}}
  gc_interval_valid: ${oc.decode:${oc.env:GC_VALID,1000}}

  nsys_profile:
    enabled: ${oc.decode:${oc.env:PROFILE,False}}
    start_step: ${oc.decode:${oc.env:PROFILE_START_STEP,10}}
    end_step: ${oc.decode:${oc.env:PROFILE_END_STEP,10}}
    ranks: [ 0 ]
    gen_shape: ${oc.decode:${oc.env:GEN_SHAPE,False}}
    nvtx_ranges: ${oc.decode:${oc.env:BREAKDOWN,False}}
    profile_cuda_graph_capture: ${oc.decode:${oc.env:PROFILE_CUDA_GRAPH_CAPTURE,False}}

  custom:
    log_metrics: ${oc.decode:${oc.env:LOG_METRICS,NEMO}}
    init_global_step: ${oc.decode:${oc.env:INIT_GLOBAL_STEP,0}}
    use_distributed_checkpointing: ${oc.decode:${oc.env:USE_DIST_CHECKPOINTING,1}}
    run_warmup_on_synth_data: ${oc.decode:${oc.env:RUN_WARMUP_ON_SYNTH_DATA,1}}
    reset_fp8_stats_after_warmup: ${oc.decode:${oc.env:RESET_FP8_STATS_AFTER_WARMUP,1}}
    pre_validate: ${oc.decode:${oc.env:PRE_VALIDATE,0}}
    warmup_train_steps: ${oc.decode:${oc.env:WARMUP_TRAIN_STEPS,2}}
    warmup_validation_steps: ${oc.decode:${oc.env:WARMUP_VALIDATION_STEPS,2}}
    cuda_graph_warmup_steps: ${oc.decode:${oc.env:CUDA_GRAPH_WARMUP_STEPS,1}}
    extend_run_evals: ${oc.decode:${oc.env:EXTEND_RUN_EVALS,${if:${eq:'1',${oc.env:MLPERF_POWER_TRAIN_AFTER_RUN_STOP,0}},2,0}}}
    disable_nemo_logs: ${oc.decode:${oc.env:DISABLE_NEMO_LOGS,True}}

misc:
  print_config: ${oc.decode:${oc.env:PRINT_CONFIG,False}}
  memory_profiler:
    enable: ${oc.decode:${oc.env:ENABLE_MEMORY_PROFILER,False}}
    file_prefix: ${oc.env:MEMORY_PROFILE_FILENAME,memdump}
    start_step: ${oc.decode:${oc.env:MEMORY_PROFILE_START_STEP,0}}
    end_step: ${oc.decode:${oc.env:MEMORY_PROFILE_END_STEP,10}}
    max_entries: ${oc.decode:${oc.env:MEMORY_PROFILE_MAX_ENTRIES,1000000}}
    rank_0_only: ${oc.decode:${oc.env:MEMORY_PROFILE_RANK_0_ONLY,True}}
    start_location: ${oc.env:MEMORY_PROFILE_START_LOCATION,init}
    end_location: ${oc.env:MEMORY_PROFILE_END_LOCATION,train_start}
    force_oom_before_stop: ${oc.decode:${oc.env:FORCE_OOM_BEFORE_STOP,False}}
    possible_oom: ${oc.decode:${oc.env:MEMORY_PROFILE_POSSIBLE_OOM,False}}

custom:
  target_log_ppl: ${oc.decode:${oc.env:TARGET_LOG_PPL,3.34}}
  force_success_status: ${oc.decode:${oc.env:FORCE_SUCCESS_STATUS,0}}
