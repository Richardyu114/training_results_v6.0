# NOTE: qkv_wgrad and fc1_wgrad bulk overlaps are intentionally omitted.
# TE WeightGradStore asserts ub_bulk_wgrad==False whenever delay_wgrad_compute
# is on; delay_wgrad_compute is required by overlap_moe_expert_parallel_comm
# (Mcore transformer_config.py). Keeping the *_dgrad bulk overlaps preserves
# the dgrad/AG concurrency without conflicting with EP A2A overlap.
qkv_dgrad:
  method: bulk
  num_sm: 2
  cga_size: 1
  set_sm_margin: 0

fc1_dgrad:
  method: bulk
  num_sm: 2
  cga_size: 1
  set_sm_margin: 0

## Ring-exchange overlap with AllGather
qkv_fprop:
  method: ring_exchange
  num_sm: 1
  set_sm_margin: 0
  atomic_gemm: 0

proj_dgrad:
  method: ring_exchange
  num_sm: 1
  set_sm_margin: 0
  atomic_gemm: 0

fc1_fprop:
  method: ring_exchange
  num_sm: 1
  set_sm_margin: 0
  atomic_gemm: 0

fc2_dgrad:
  method: ring_exchange
  num_sm: 1
  set_sm_margin: 0
  atomic_gemm: 0

# Chunked-collective overlap with ReduceScatter
proj_fprop:
  method: pipeline
  num_sm: 8           # was 24 → ~⅓ persistent mem
  cga_size: 1         # was 2  → half per-SM reservation
  num_splits: 2       # was 4  → half total allocation
  set_sm_margin: 1
  atomic_gemm: ${oc.decode:${oc.env:TE_UB_ATOMIC_GEMM_RS_PROJ,1}}
  fp8_buf: 0          # force off to avoid FP8 buffer overhead in eval

fc2_fprop:
  method: ring_exchange
  num_sm: 1
  set_sm_margin: 1
  atomic_gemm: ${oc.decode:${oc.env:TE_UB_ATOMIC_GEMM_RS_FC2,0}}
  fp8_buf: 0